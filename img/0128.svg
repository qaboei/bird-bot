<text x="20.00" y="205.00" font-size="3.2" fill="#1b2330" text-anchor="start" font-weight="700">NOTES</text>
<text x="20.00" y="211.00" font-size="2.4" fill="#5b6576" text-anchor="start" font-weight="400">· Same parts and pins as v4, plus the two wing-nose edge sensors on GPIO 4 and 13 (the v4.2 'layout B').</text>
<text x="20.00" y="215.80" font-size="2.4" fill="#5b6576" text-anchor="start" font-weight="400">· Battery, fuse and switch sit together at the back of the keel: short, thick power leads; the L298N is 30 mm away.</text>
<text x="20.00" y="220.60" font-size="2.4" fill="#5b6576" text-anchor="start" font-weight="400">· Signal wires run in a channel down the keel's centre to the bridge; motor leads drop straight into the pod walls.</text>
<text x="20.00" y="225.40" font-size="2.4" fill="#5b6576" text-anchor="start" font-weight="400">· Cells charge outside the robot in the TP4056 holder: lift the vent hatch, unclip the holder.</text>
