<text x="358.00" y="86.30" font-size="2.2" fill="#5b6576" text-anchor="start" font-weight="400">black</text>
<text x="222.00" y="93.70" font-size="2.4" fill="#1b2330" text-anchor="start" font-weight="600">≈ 10–12 plates on the A1 mini · ≈ 1.0 kg PLA (estimate, firmed up in 3D)</text>
<text x="222.00" y="104.00" font-size="3.2" fill="#1b2330" text-anchor="start" font-weight="700">LOAD PATH</text>
<text x="222.00" y="110.00" font-size="2.3" fill="#5b6576" text-anchor="start" font-weight="400">· Push: blade → scoop → T-rail → keel floor → motor cradles → tyres. The shell never carries a push.</text>
<text x="222.00" y="114.60" font-size="2.3" fill="#5b6576" text-anchor="start" font-weight="400">· Side hits land on the wings, which bolt to the pod covers (4 × M3 each) and to the carapace (2 × M3).</text>
<text x="222.00" y="119.20" font-size="2.3" fill="#5b6576" text-anchor="start" font-weight="400">· The carapace plates lap front-over-back like armour (6 mm) and bolt to 5 keel posts.</text>
<text x="222.00" y="123.80" font-size="2.3" fill="#5b6576" text-anchor="start" font-weight="400">· The vent hatch is a quarter-turn bayonet: battery access without tools.</text>
<text x="222.00" y="128.40" font-size="2.3" fill="#5b6576" text-anchor="start" font-weight="400">· Every split line sits on an armour seam, so the joins are part of the look.</text>
<text x="222.00" y="142.00" font-size="3.6" fill="#e4572e" text-anchor="start" font-weight="800">FOR YOUR OK</text>
<text x="222.00" y="149.00" font-size="2.6" fill="#1b2330" text-anchor="start" font-weight="400">1  4WD gear pods (recommended), or v4's 2 driven + 2 free tyres</text>
<text x="222.00" y="154.20" font-size="2.6" fill="#1b2330" text-anchor="start" font-weight="400">2  silhouette: 278 wing to wing, 320 long with the tail, crest 86, fins 100</text>
<text x="222.00" y="159.40" font-size="2.6" fill="#1b2330" text-anchor="start" font-weight="400">3  livery: pearl carapace, orange wings, gunmetal keel, black grille, silver scoop, red accents</text>
<text x="222.00" y="164.60" font-size="2.6" fill="#1b2330" text-anchor="start" font-weight="400">4  scoop 93 long, tip 102 ahead of the front tyre, steel ruler blade</text>
<text x="222.00" y="169.80" font-size="2.6" fill="#1b2330" text-anchor="start" font-weight="400">5  then: anatomy figure → 3D parts → A1 mini plates</text>
