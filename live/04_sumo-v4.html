<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sumo v4.1</title><style>

  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}

  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}

.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}

.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}

.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}

.sb-ring{fill:none}
.sb-border{fill:var(--sb-border);opacity:.92}
.sb-offring{fill:var(--sb-off)}
.sb-dropface{fill:var(--sb-edge)}

.iso[data-theme="light"] .sb-startline{fill:#8a5a32;opacity:.75}
.sb-beam{stroke:none}
.sb-hit{fill:var(--sb-beam)}
.sb-arrow{stroke:var(--anatomy-lit);stroke-width:1.2;fill:none;stroke-linecap:round}

/* tooltip and controls */
.sb-tip{position:absolute;pointer-events:none;z-index:3;max-width:260px;padding:5px 8px;border-radius:6px;background:var(--anatomy-card);color:var(--anatomy-strong);font:500 11.5px/1.35 var(--anatomy-mono);box-shadow:var(--anatomy-lift);white-space:normal}

.sb-bar button{font:500 11.5px/1 var(--anatomy-mono);color:var(--anatomy-text);background:var(--anatomy-card);border:0;border-radius:6px;padding:6px 10px;box-shadow:var(--anatomy-lift);cursor:pointer}
.sb-bar button[aria-pressed="true"],.sb-bar button[data-on]{color:var(--anatomy-strong)}
.sb-bar button[data-mode="ps5"]{color:var(--sb-sig)}
.sb-robot .it[data-label]{cursor:default}

.sb-fsm{margin-top:8px}
.sb-chips{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}

revious state">◀</button><button type="button" data-act="next" hidden aria-label="Next state">▶</button></div><div class="sb-fsm" data-fsm hidden><ol class="sb-chips" data-chips></ol><p class="sb-say" data-say aria-live="polite"></p></div><span class="sb-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>What is acting now: the start code, the sensor that sees, the driver and the motor that push</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Pink: the printed PETG parts (base, nose, caps, couplers, hubs, shelf); brass: the JGB37 gearboxes; yellow: the TT wheel hubs</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Harness: 3S 18650 → fuse → switch → L298N and LM2596; jumper leads from the ESP32 to everything else</span></span><span class="iso-caption">Version 4.1 keeps every tyre the rules ask for, four, and drives two of them. The two JGB37-520 gearmotors (12 V, 320 rpm) sit back to back on the front axle, so their tyres are directly opposite and the robot turns about its own middle. Back to back, neither motor can slide in along its axis, so each one drops into a printed cradle through a face plate whose shaft slot is open at the top, and a cap with two M3 × 30 bolts squeezes it down. The rear tyres spin freely on printed hubs around a fixed M3 × 20 bolt. The robot is 255 × 203.1 mm and weighs about 1.03 kg, 73 % of it on the driven tyres. Its grip-limited push is about 6.6 N, or 9.3 N with 300 g of steel over the front axle. Top speed is about 0.98 m/s with no load. The simulated opponent is a 1 kg box with its motors off, so it rolls. Against one that drives back, the grip numbers above set the outcome. Motion is shown at a quarter of real speed. Masses come from the parts table: weigh the built robot.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;

        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    }
    let fill;

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

    }
    html += `<path class="sb-cone"${sees ? " data-on" : ""} d="${pth(pts.map(at))}" data-label="HC-SR04 ${sn.id} · its cone on the mat; it sees anything nearer than 800 mm"/>`;
    if (sees) {
      const ph = ((sc.t * 2.2) % 1);
      const rr = d * ph;
      const arc = [];
      for (let k2 = -8; k2 <= 8; k2++) {
        const a = base + (CONE * k2) / 8;
        arc.push([sn.o[0] + Math.cos(a) * rr, sn.o[1] + Math.sin(a) * rr, 1]);
      }
      html += `<path class="sb-echo" opacity="${(1 - ph).toFixed(2)}" d="${pth(arc.map(at), false)}"/>`;
    }
  });
  D.tcrt.forEach((s, i) => {
    if (!r.edge[i]) return;
    const c = at([s.at[0], s.at[1], 0.2]);
    html += `<ellipse class="sb-edge-spot" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="3.2" ry="1.8"/>`;
  });
  beamsEl.innerHTML = html;
}
const wheelAngle = {};
for (const w of D.wheels) wheelAngle[w.id] = 0;
function drawSpokes() {
  for (const w of D.wheels) {
    const el = spokes[w.id];
    if (!el) continue;
    const F = { o: w.o, a: w.a, u: w.u, v: w.v };
    let d = "";
    for (let i = 0; i < 5; i++) {
      const a = wheelAngle[w.id] + (i / 5) * Math.PI * 2;
      d += pth([at(G.pointOf(F, D.wheelW - 1.6, 6.5, a)), at(G.pointOf(F, D.wheelW - 1.6, 24, a))], false); // from under the hub to the tyre's inner edge
    }
    el.setAttribute("d", d);
  }
}

// ---------------------------------------------------------------- state, loop, input
const state = { steps: false, holdAt: 0, clock: 0, t: 0, touring: !still.matches, caps: false };
let frame = 0, last = 0, visible = false;
const STILL_T = RUN.contactAt !== null ? T.go + ((RUN.contactAt + 120) / 1000) * SPEED : T.go;
let lastPhase = "";
const f0 = (v) => Math.round(v);
function words(sc) {
  const r = sc.r;
  const v = (((r.vL + r.vR) / 2) * 1).toFixed(2);
  const d = (x) => (x < 4000 ? `${f0(x)} mm` : "—");
  switch (sc.phase) {
    case "WAIT": return `waiting · ${D.push.bare.toFixed(1)} N grip-limited push`;
    case "START": return "RC-5 start code · VS1838B → ESP32";
    case "SEARCH": return `searching · spinning ${r.dutyL < 0 ? "left" : "right"} · sonars ${d(r.dL)} / ${d(r.dR)}`;
    case "TRACK": return `${r.seeL ? "left" : "right"} sonar sees it at ${d(r.seeL ? r.dL : r.dR)} · turning`;
    case "ATTACK": return `both sonars see it · full PWM · ${v} m/s`;
    case "PUSH": return `pushing · ${v} m/s · blade under its edge`;
    case "OFF RING": return `off the ring · ${v} m/s`;
    case "EDGE_BACK": return `edge · ${RUN.edgeBy} TCRT5000 sees white · reversing`;
    case "EDGE_SPIN": return "edge · spinning away from the border";
    case "STOPPED": case "DONE": return "RC-5 stop code · motors braked";
  }
  return "";
}
function render(dt) {
  const t = state.t;
  const sc = scene(t);
  drawWorld(sc);
  drawOpponent(sc);
  drawBeams(sc);
  if (sc.t >= T.go) {
    const r = sc.r;
    for (const w of D.wheels) wheelAngle[w.id] -= ((w.side < 0 ? r.vL : r.vR) * 1000 * dt) / SPEED / D.wheelR;
  }
  drawSpokes();
  if (sc.irRing >= 0) {
    const c = at(D.irDome);
    const rr = 2 + sc.irRing * 26;
    fxEl.innerHTML = `<ellipse class="sb-ir-ring" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${rr.toFixed(1)}" ry="${(rr * 0.5).toFixed(1)}" opacity="${(1 - sc.irRing).toFixed(2)}"/>`;
  } else fxEl.innerHTML = "";
  applySignals(sc.pulses, sc.steady);
  applyOn(sc.on);
  for (const [id, el] of Object.entries(leds)) el.toggleAttribute("data-on", sc.leds[id] === 1);
  place();
  const text = words(sc);
  if (readout.textContent !== text) readout.textContent = text;
  if (sc.phase !== lastPhase) {
    lastPhase = sc.phase;
    statusEl.textContent = text;
  }
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  state.clock += dt;
  if (state.steps) state.t = Math.min(state.holdAt, state.t + dt * 0.5);
  else if (state.touring) {
    state.t += dt;
    if (state.t > LOOP) state.t = 0;
  }
  let moving = false;
  for (const id of D.stagger) moving = stepSpring(peel[id], dt, calm, state.clock) || moving;
  render(dt);
  const busy = state.touring || state.steps || moving;
  if (state.steps) showFsm();
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

function toggleCaps() {
  state.caps = !state.caps;
  btn.caps.textContent = state.caps ? "Caps on" : "Caps off";
  btn.caps.setAttribute("aria-pressed", String(state.caps));
  setPeel(state.caps, state.clock);
  statusEl.textContent = state.caps ? "Caps lifted: each gearbox sits in its cradle's half ring" : "Caps bolted down";
  if (still.matches) render(0);
  run();
}
function replay() {
  if (state.steps) return goState(0);
  state.t = 0;
  state.touring = !still.matches;
  if (still.matches) {
    state.t = STILL_T;
    render(0);
  }
  run();
}

// ---------------------------------------------------------------- steps: the firmware's states
const fsmEl = stage.querySelector("[data-fsm]");
const chipsEl = stage.querySelector("[data-chips]");
const sayEl = stage.querySelector("[data-say]");
const R2 = (ms) => (ms === null || ms === undefined ? null : T.go + (ms / 1000) * SPEED);
const firstOf = (fn) => {
  const r = RUN.find(fn);
  return r ? R2(r.t) : null;
};
const FSM = [
  ["WAIT", 0, `Power on: the ESP32 waits with its LED blinking slowly. The VS1838B listens for the referee's RC-5 start code; the BOOT button starts a 5 s countdown instead.`],
  ["START", T.ir, "The start code arrives on GPIO 23: the ESP32 goes straight to SEARCH."],
  ["SEARCH", T.go, `Both motors at duty ${DUTY.search}/255 in opposite directions: the robot spins left on the spot, about its own middle, because the driven tyres face each other across the axle. The two sonars ping in turn, 12 ms apart, so neither hears the other's echo.`],
  ["TRACK", R2(RUN.trackAt), "The left sonar sees the opponent inside 800 mm: the left tyre crawls back, the right one drives, until both sonars agree."],
  ["ATTACK", R2(RUN.attackAt), `Both sonars see it, so it is dead ahead: full PWM on both channels. Top speed is about ${VMAX.toFixed(2)} m/s; the L298N drops about 2 V, so the 12 V motors see about 10.6 V.`],
  ["PUSH", R2(RUN.contactAt), `The ruler slides under the opponent's edge. Only the front tyres drive: they carry ${Math.round(0.73 * 100)} % of the weight, so the push is grip-limited at about ${D.push.bare.toFixed(1)} N (${D.push.b300.toFixed(1)} N with 300 g of ballast over the axle).`],
  ["OFF RING", R2(RUN.fallAt), "The opponent's middle passes the ring's edge and it drops off."],
  ["EDGE BACK", R2(RUN.edgeAt), `The ${RUN.edgeBy} TCRT5000 sees the white border: the edge wins over everything. Both motors reverse at duty ${DUTY.back} for ${BACK_MS} ms.`],
  ["EDGE SPIN", firstOf((r) => r.state === "EDGE_SPIN"), `A ${SPIN_MS} ms spin away from the side that saw white, then back to SEARCH.`],
  ["STOP", R2(RUN.stopAt), "The referee's RC-5 stop code: both channels brake and the robot waits."],
].filter(([, t0]) => t0 !== null).map(([id, t0, text]) => ({ id, t0, text }));
let fsmShown = "";
function fsmIndex(t) {
  let i = 0;
  while (i + 1 < FSM.length && t >= FSM[i + 1].t0 - 1e-3) i++;
  return i;
}
chipsEl.innerHTML = FSM.map((s, i) => `<li><button type="button" data-state="${i}">${s.id}</button></li>`).join("");
function showFsm() {
  const i = fsmIndex(state.t);
  if (String(i) === fsmShown) return;
  fsmShown = String(i);
  chipsEl.querySelectorAll("button").forEach((b, j) => {
    b.toggleAttribute("data-on", j === i);
    b.toggleAttribute("data-past", j < i);
  });
  sayEl.textContent = `${i + 1}/${FSM.length} · ${FSM[i].id}: ${FSM[i].text}`;
}
function goState(i) {
  i = clamp(i, 0, FSM.length - 1);
  state.t = FSM[i].t0;
  state.holdAt = i + 1 < FSM.length ? FSM[i + 1].t0 - 0.02 : T_END + T.hold * 0.5;
  run();
}
function toggleSteps() {
  state.steps = !state.steps;
  btn.steps.setAttribute("aria-pressed", String(state.steps));
  btn.prev.hidden = btn.next.hidden = fsmEl.hidden = !state.steps;
  if (state.steps) goState(Math.min(fsmIndex(state.t), FSM.length - 1));
  else state.touring = !still.matches;
  run();
}
btn.steps.addEventListener("click", toggleSteps);
btn.prev.addEventListener("click", () => goState(fsmIndex(state.t) - 1));
btn.next.addEventListener("click", () => goState(fsmIndex(state.t) + 1));
chipsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-state]");
  if (b) goState(+b.dataset.state);
});
btn.caps.addEventListener("click", toggleCaps);
btn.replay.addEventListener("click", replay);
stage.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  if (key === "c") toggleCaps();
  else if (key === " " || key === "enter") replay();
  else if (key === "t") toggleSteps();
  else if (state.steps && (key === "arrowright" || key === "n")) goState(fsmIndex(state.t) + 1);
  else if (state.steps && (key === "arrowleft" || key === "p")) goState(fsmIndex(state.t) - 1);
  else return;
  e.preventDefault();
});

// hover labels
let hovered = null;
svg.addEventListener("pointermove", (e) => {
  const target = e.target.closest?.("[data-label]");
  const it = target?.closest(".it") || null;
  if (hovered !== it) {
    hovered?.removeAttribute("data-hover");
    it?.setAttribute("data-hover", "");
    hovered = it;
  }
  if (!target) {
    tipEl.hidden = true;
    return;
  }
  tipEl.textContent = target.dataset.label;
  tipEl.hidden = false;
  const box = stage.getBoundingClientRect();
  const x = e.clientX - box.left, y = e.clientY - box.top;
  const w = tipEl.offsetWidth;
  tipEl.style.left = `${Math.min(box.width - w - 4, Math.max(4, x + 14))}px`;
  tipEl.style.top = `${Math.max(4, y - 34)}px`;
});
svg.addEventListener("pointerleave", () => {
  tipEl.hidden = true;
  hovered?.removeAttribute("data-hover");
  hovered = null;
});

window.__sumo = { RUN, FSM, T, LOOP, state, render, setT: (t) => ((state.t = t), (state.touring = false), render(0)), caps: toggleCaps };
if (still.matches) {
  state.touring = false;
  state.t = STILL_T;
}
render(0);
stage.addEventListener("focus", () => (statusEl.textContent = readout.textContent));
</script></body></html>
