rk="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Orange: printed PETG wedge shell and beak cover; charcoal tub; grey deck; blue-grey steel</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Harness: power from the battery through the switch; logic from the ESP32; sensor leads to the hub</span></span><span class="iso-caption">The robot as built: 199 × 299 mm, 2.93 kg, a 12° beak whose steel blade sits 0.3 mm off the mat, then a 54 mm lip into one roll-over curve. On the start signal the IR module wakes the ESP32; the three Keyence sensors look straight ahead and 25° to each side, and the first to see the opponent turns the robot toward it. Both Pololu G2 drivers then drive all four gearmotors. The blade slides under the opponent, its front wheels leave the mat and part of its weight rests on our beak: our front tyres press harder while its grip falls. When a QRE1113 sees the white border the robot backs off. In PS5 mode the DualSense drives instead, through the ESP32's Bluetooth radio, and the motors stop if the link is silent for 200 ms. Motion is shown at a quarter of real speed.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);

      }

    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);

      const mid = levelOf(i, (a.u + b.u) / 2);

        return;

      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  let bevelPath = "";

    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));

}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);

  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {

// Pure model of the robot: dimensions, profile and statics. Shared by the build and the page.
const D2R = Math.PI / 180;

const BOT = {
  tip: 189, // blade edge, y (mm); robot runs +y forward
  back: -110,
  half: 99.5,
  blade: { w: 196, d: 50, t: 2, lift: 0.3 },
  slope: 12, // degrees
  slopeRun: 116, // along the slope, mm
  r1: 54, // concave radius
  seamAngle: 60, // concave turns 12° → 60°, then the shell's roll-over curve takes over
  topAngle: 4,
  height: 90,
  backR: 8,
  sideBottom: 16,
  wheel: { r: 30, w: 18, axles: [10, -70], outer: 97 }, // the brief's +20 / -60, with y = 0 placed 10 mm further forward so the front tyres clear the lip
  motorLift: 7,
  mass: 2.93,
  com: 2, // y of the centre of mass, just behind the front axle

// Top line of the wedge, tip → back, as [y, z] points with the angle of travel.
function profile({ step = 1.5 } = {}) {
  const t = Math.tan(BOT.slope * D2R);
  const out = [];
  const tipZ = BOT.blade.lift;
  const run = BOT.slopeRun;
  const y1 = BOT.tip - run * Math.cos(BOT.slope * D2R);
  const z1 = tipZ + run * Math.sin(BOT.slope * D2R);
  for (let s = 0; s <= run + 1e-6; s += run / 24) out.push({ y: BOT.tip - s * Math.cos(BOT.slope * D2R), z: tipZ + s * Math.sin(BOT.slope * D2R), part: "slope" });
  // concave arc
  const a0 = BOT.slope * D2R;
  const am = BOT.seamAngle * D2R;
  const c1 = [y1 + BOT.r1 * Math.sin(a0), z1 + BOT.r1 * Math.cos(a0)];
  const n1 = 20;
  for (let i = 1; i <= n1; i++) {

    out.push({ y: c1[0] - BOT.r1 * Math.sin(a), z: c1[1] - BOT.r1 * Math.cos(a), part: "concave" });
  }
  const seam = out[out.length - 1];
  // convex roll-over: solve r2 so the top lands at BOT.height on the back face
  const at = BOT.topAngle * D2R;

  const build = (r2) => {
    // horizontal run left for the flat top
    const dh2 = r2 * (Math.sin(am) - Math.sin(at));
    const dhCorner = rb * (Math.sin(at) + 1);
    const L = seam.y - BOT.back - dh2 - dhCorner;
    const z = seam.z + r2 * (Math.cos(at) - Math.cos(am)) + L * Math.tan(at) + rb * (1 - Math.cos(at));
    return { L, z };

  let lo = 10, hi = 400;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (build(mid).z < BOT.height) lo = mid;
    else hi = mid;

  const r2 = (lo + hi) / 2;
  const { L } = build(r2);
  const c2 = [seam.y - r2 * Math.sin(am), seam.z - r2 * Math.cos(am)];
  const n2 = 40;
  for (let i = 1; i <= n2; i++) {
    const a = am + ((at - am) * i) / n2;
    out.push({ y: c2[0] + r2 * Math.sin(a), z: c2[1] + r2 * Math.cos(a), part: "roll" });

  const nT = 8;
  for (let i = 1; i <= nT; i++) out.push({ y: topStart.y - (L * i) / nT, z: topStart.z + (L * i * Math.tan(at)) / nT, part: "top" });

  const c3 = [cs.y - rb * Math.sin(at), cs.z - rb * Math.cos(at)];

  const n3 = 10;
  for (let i = 1; i <= n3; i++) {
    const a = at + ((-Math.PI / 2 - at) * i) / n3;
    out.push({ y: c3[0] + rb * Math.sin(a), z: c3[1] + rb * Math.cos(a), part: "corner" });

// Height of the wedge's top surface at y (for anything riding on it).
function topAt(y, pts) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if ((y <= a.y && y >= b.y) || (y >= a.y && y <= b.y)) {

const G0 = 9.81;
const OPP = { mass: 3.0, len: 190, wid: 170, h: 42, wheelR: 24, wheelIn: 45, lip: 3 };
function loads(transfer = 0, at = BOT.tip) {
  const W = BOT.mass * G0;
  const [yf, yr] = BOT.wheel.axles;
  // moments about the rear axle
  let Nf = (W * (BOT.com - yr) + transfer * (at - yr)) / (yf - yr);
  let Nr = W + transfer - Nf;
  let Ntip = 0;

    Nf = (W * (BOT.tip - BOT.com) + transfer * (BOT.tip - at)) / (BOT.tip - yf);

    el.toggleAttribute("data-ir", v === "ir");
  }
  for (const [id, el] of Object.entries(qreEls)) el.parentElement.toggleAttribute("data-on", !!sc.qreSees[id]);
  place();
  let text = words(sc, f);
  if (state.mode === "ps5" && !state.link && state.linkLostAt !== null) text = state.frozen ? "link lost · motors off at 200 ms" : "link lost · 200 ms failsafe";
  if (readout.textContent !== text) readout.textContent = text;
  if (sc.phase !== lastPhase) {
    lastPhase = sc.phase;
    announce(text);
  }
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  state.clock += dt;
  if (state.steps && !state.frozen) {
    state.t = Math.min(state.holdAt, state.t + dt * 0.5);
  } else if (state.touring && !state.frozen) {

    const loop = scene(state.t, state.mode).loop;
    if (state.t > loop) state.t = 0;
  }
  if (state.mode === "ps5" && !state.link && state.linkLostAt !== null && state.clock - state.linkLostAt > 0.2 * SPEED) state.frozen = true;
  let moving = false;
  for (const id of ["shell", "cover"]) moving = stepSpring(peel[id], dt, calm, state.clock) || moving;
  render(state.frozen ? 0 : dt);
  const busy = state.touring || state.steps || moving;
  if (state.steps) showFsm();
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

function toggleShell() {
  const open = !(state.shellUser ?? true);
  state.shellUser = open;
  btn.shell.textContent = open ? "Shell off" : "Shell on";
  btn.shell.setAttribute("aria-pressed", String(open));
  setPeel(open, state.clock, open ? ["shell"] : ["shell", "cover"]);
  if (still.matches) render(0);
  run();
}
function toggleMode() {
  state.mode = state.mode === "auto" ? "ps5" : "auto";
  btn.mode.textContent = state.mode === "auto" ? "AUTO" : "PS5";
  btn.mode.dataset.mode = state.mode;
  btn.drop.hidden = state.mode !== "ps5";
  state.link = true;
  state.linkLostAt = null;
  state.frozen = false;
  btn.drop.textContent = "Drop link";
  state.t = 0;
  announce(state.mode === "auto" ? "AUTO: the sensors drive" : "PS5: the DualSense drives over Bluetooth");
  FSM = fsmOf(state.mode);
  buildChips();
  if (state.steps) goState(0);
  if (still.matches) render(0);
  run();
}
function replay() {
  if (state.steps) return goState(0);
  state.t = 0;
  state.touring = !still.matches;
  state.frozen = false;
  state.link = true;
  state.linkLostAt = null;
  btn.drop.textContent = "Drop link";
  if (still.matches) {
    state.t = STILL_T;
    render(0);
  }
  run();
}
function dropLink() {
  if (state.mode !== "ps5") return;
  if (state.link) {
    state.link = false;
    state.linkLostAt = state.clock;
    btn.drop.textContent = "Restore link";
  } else {
    state.link = true;
    state.linkLostAt = null;
    state.frozen = false;
    btn.drop.textContent = "Drop link";
  }
  run();
}

// ---------------------------------------------------------------- steps: the match as a state machine
const fsmEl = stage.querySelector("[data-fsm]");
const chipsEl = stage.querySelector("[data-chips]");
const sayEl = stage.querySelector("[data-say]");
function fsmOf(mode) {
  const s = scene(0, mode);
  const R = (x) => (x === null || x === undefined ? null : s.tGo + x * SPEED);
  const first = (ph) => {
    const i = RUN.findIndex((r) => r.phase === ph);
    return i < 0 ? null : R(RUN[i].t);
  };
  const k = D.keys.find((x) => x.id === "L");
  const hit = Math.round(beamHitDist([k.lens[0], k.lens[1]], k.fwd, { c: OPP0, yaw: BEAR }));
  const list = [
    ["IDLE", 0, "Power on, ESP32 in standby. The IR start module listens for the referee's 38 kHz start code."],
    ["START", T.ir, "Start code received: the module's signal pin switches and the ESP32 starts the match."],
  ];
  if (mode === "auto")
    list.push(
      ["SEARCH", T.sweep0, "The ESP32 polls the three Keyence NPN outputs: straight ahead, 25° left and 25° right, 1 m reach."],
      ["TARGET", s.tHit, `The left sensor's output switches on: opponent ${hit} mm away, 25° to the left. Its lead runs to the hub, then to an ESP32 GPIO.`],
    );
  else list.push(["LINK", T.sweep0 - 0.4, "The DualSense's stick arrives over Bluetooth (Bluepad32). The sensors are still read, but the driver steers. Silence for 200 ms stops the motors."]);
  list.push(
    ["COMMAND", s.tDecide, "The ESP32 sets PWM and direction on both Pololu G2 drivers: left pair reverse, right pair forward."],
    ["TURN", s.tTurn, "Skid steer in place, about 25°, until the opponent is dead ahead."],
    ["CHARGE", s.tGo, "Full PWM on both drivers: all four gearmotors drive forward, accelerating to about 1 m/s."],
    ["LIFT", first("lift"), `The blade edge slides under. After ${Math.round(P_LIFT)} mm the slope meets the opponent's lip and its front wheels leave the mat. Part of its weight now rests on our beak: our tyres press harder, its grip falls.`],
    ["OFF RING", R(RUN.fallAt), "The opponent's rear wheels pass the ring edge and it tips off."],
    ["EDGE", R(RUN.edgeAt), `The ${RUN.edgeBy} QRE1113 sees the white border: the ESP32 reverses both drivers.`],
    ["BACK OFF", first("back"), "Reversing away from the border at 0.6 m/s."],
    ["STOP", first("stop"), "Both drivers brake to zero. Waiting for the next command."],
  );
  return list.filter(([, t0]) => t0 !== null).map(([id, t0, text]) => ({ id, t0, text }));
}
let FSM = fsmOf("auto");
let fsmShown = "";
function fsmIndex(t) {
  let i = 0;
  while (i + 1 < FSM.length && t >= FSM[i + 1].t0 - 1e-3) i++;
  return i;
}
function buildChips() {
  chipsEl.innerHTML = FSM.map((s, i) => `<li><button type="button" data-state="${i}">${s.id}</button></li>`).join("");
  fsmShown = "";
}
function showFsm() {
  const i = fsmIndex(state.t);
  const key = `${state.mode}:${i}`;
  if (key === fsmShown) return;
  fsmShown = key;
  chipsEl.querySelectorAll("button").forEach((b, j) => {
    b.toggleAttribute("data-on", j === i);
    b.toggleAttribute("data-past", j < i);
  });
  sayEl.textContent = `${i + 1}/${FSM.length} · ${FSM[i].id}: ${FSM[i].text}`;
}
function goState(i) {
  i = clamp(i, 0, FSM.length - 1);
  state.cur = i;
  state.t = FSM[i].t0;
  const sc = scene(0, state.mode);
  state.holdAt = i + 1 < FSM.length ? FSM[i + 1].t0 - 0.02 : sc.tEnd + T.hold * 0.5;
  state.frozen = false;
  run();
}
function toggleSteps() {
  state.steps = !state.steps;
  btn.steps.setAttribute("aria-pressed", String(state.steps));
  btn.prev.hidden = btn.next.hidden = fsmEl.hidden = !state.steps;
  if (state.steps) {
    FSM = fsmOf(state.mode);
    buildChips();
    goState(Math.min(fsmIndex(state.t), FSM.length - 1));
  } else {
    state.touring = !still.matches;
  }
  run();
}
btn.steps.addEventListener("click", toggleSteps);
btn.prev.addEventListener("click", () => goState(fsmIndex(state.t) - 1));
btn.next.addEventListener("click", () => goState(fsmIndex(state.t) + 1));
chipsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-state]");
  if (b) goState(+b.dataset.state);
});
btn.shell.addEventListener("click", toggleShell);
btn.mode.addEventListener("click", toggleMode);
btn.replay.addEventListener("click", replay);
btn.drop.addEventListener("click", dropLink);
stage.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "s") toggleShell();
  else if (k === "m") toggleMode();
  else if (k === " " || k === "enter") replay();
  else if (k === "l") dropLink();
  else if (k === "t") toggleSteps();
  else if (state.steps && (k === "arrowright" || k === "n")) goState(fsmIndex(state.t) + 1);
  else if (state.steps && (k === "arrowleft" || k === "p")) goState(fsmIndex(state.t) - 1);
  else return;
  e.preventDefault();
});

// hover labels
let hovered = null;
svg.addEventListener("pointermove", (e) => {
  const target = e.target.closest?.("[data-label]");
  const it = target?.closest(".it") || null;
  if (hovered !== it) {
    hovered?.removeAttribute("data-hover");
    it?.setAttribute("data-hover", "");
    hovered = it;
  }
  if (!target) {
    tipEl.hidden = true;
    return;
  }
  tipEl.textContent = target.dataset.label;
  tipEl.hidden = false;
  const box = stage.getBoundingClientRect();
  const x = e.clientX - box.left, y = e.clientY - box.top;
  const w = tipEl.offsetWidth;
  tipEl.style.left = `${Math.min(box.width - w - 4, Math.max(4, x + 14))}px`;
  tipEl.style.top = `${Math.max(4, y - 34)}px`;
});
svg.addEventListener("pointerleave", () => {
  tipEl.hidden = true;
  hovered?.removeAttribute("data-hover");
  hovered = null;
});

if (still.matches) {
  state.touring = false;
  state.t = STILL_T;
}
render(0);
stage.addEventListener("focus", () => announce(readout.textContent));
</script></body></html>
